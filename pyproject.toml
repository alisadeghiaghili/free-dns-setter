[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── project metadata (PEP 621) ──────────────────────────────────────────────
[project]
name            = "dns-changer"
version         = "2.2.0"
description     = "Cross-platform DNS manager for Iranian users — one-click DNS switching (GUI + CLI) on Windows, Linux (Ubuntu/Debian), and macOS, with verified anti-sanction, anti-filter, gaming, and general resolvers"
readme          = "README.md"
license         = { text = "Apache-2.0" }
requires-python = ">=3.11"

authors = [
  { name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com" },
]

keywords = [
  "dns", "iran", "anti-sanction", "anti-filter",
  "shecan", "begzar", "network", "cross-platform",
  "windows", "linux", "ubuntu", "macos",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking",
]

dependencies = [
  # WMI is Windows-only; the Linux (nmcli) and macOS (networksetup) backends
  # rely on OS-bundled tools, so only this import is platform-gated.
  "WMI>=1.5; sys_platform == \"win32\"",
  "rich>=13.0",
]

# ── optional dependency groups ──────────────────────────────────────────────
[project.optional-dependencies]
cli = ["rich>=13.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

# ── console entry points ─────────────────────────────────────────────────────
[project.scripts]
dns-changer     = "dns_changer.main:main"
dns-changer-cli = "dns_changer.cli:main"

# ── project URLs ─────────────────────────────────────────────────────────────
[project.urls]
Homepage   = "https://github.com/alisadeghiaghili/free-dns-setter"
Repository = "https://github.com/alisadeghiaghili/free-dns-setter"
Changelog  = "https://github.com/alisadeghiaghili/free-dns-setter/blob/main/CHANGELOG.md"
Issues     = "https://github.com/alisadeghiaghili/free-dns-setter/issues"

# ── tool config ──────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

# ── test config ──────────────────────────────────────────────────────────────
# Coverage is measured over the whole package and enforced at a 95% floor so
# the suite can't silently regress. Run with:  pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts    = "--cov=dns_changer --cov-report=term-missing --cov-fail-under=95"
